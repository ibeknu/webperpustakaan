<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Pengunjung Perpustakaan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 relative">

    <!-- Tombol Menu Titik Tiga (Pojok Kanan Atas) -->
    <div class="fixed top-4 right-4 z-40">
        <button onclick="toggleMenu()" class="p-2.5 bg-white text-slate-600 hover:text-indigo-600 hover:bg-slate-50 border border-slate-200 rounded-full shadow-md transition focus:outline-none">
            <i class="fa-solid fa-ellipsis-vertical text-lg px-1"></i>
        </button>

        <!-- Dropdown Menu -->
        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-200 py-1 text-xs sm:text-sm text-slate-700">
            <button onclick="bukaModalLogin()" class="w-full text-left px-4 py-2.5 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-2 transition">
                <i class="fa-solid fa-user-shield text-indigo-500"></i>
                <span class="font-medium">Login Admin / Petugas</span>
            </button>
        </div>
    </div>

    <!-- Header / Branding -->
    <header class="w-full max-w-lg text-center mt-2 mb-4">
        <div class="inline-flex items-center justify-center p-3 bg-indigo-600 text-white rounded-2xl shadow-lg mb-3">
            <i class="fa-solid fa-book-open text-3xl text-amber-300"></i>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Selamat Datang</h1>
        <p class="text-sm sm:text-base text-slate-500 mt-1">Silakan isi presensi kehadiran pengunjung perpustakaan</p>
        
        <!-- Live Clock & Date -->
        <div class="mt-3 inline-block px-4 py-1.5 bg-white border border-slate-200 rounded-full shadow-sm">
            <span id="liveDate" class="text-xs sm:text-sm font-medium text-slate-600"></span>
            <span class="mx-1.5 text-slate-300">•</span>
            <span id="liveClock" class="text-xs sm:text-sm font-mono font-bold text-indigo-600"></span>
        </div>
    </header>

    <!-- Card Form Pengunjung -->
    <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200/80 p-6 sm:p-8 my-auto">
        
        <!-- Pop-up Notifikasi Sukses Presensi -->
        <div id="successAlert" class="hidden mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 flex items-center gap-3">
            <div class="p-2 bg-emerald-500 text-white rounded-full">
                <i class="fa-solid fa-check text-lg"></i>
            </div>
            <div>
                <h4 class="font-bold text-sm">Presensi Berhasil!</h4>
                <p class="text-xs text-emerald-700">Terima kasih, data kunjungan Anda telah terrekam.</p>
            </div>
        </div>

        <form id="presensiForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
            <!-- Input Nama -->
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Nama Lengkap <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="namaInput" required placeholder="Masukkan nama lengkap Anda"
                        class="w-full pl-11 pr-4 py-3 text-sm sm:text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50/50 focus:bg-white">
                </div>
            </div>

            <!-- Input NIM / NIK -->
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    NIM / NIK / Nomor Anggota <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="idInput" required placeholder="Masukkan nomor ID / NIM / NIK"
                        class="w-full pl-11 pr-4 py-3 text-sm sm:text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50/50 focus:bg-white">
                </div>
            </div>

            <!-- Kategori -->
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Kategori Pengunjung <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-graduation-cap absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select id="kategoriInput" required
                        class="w-full pl-11 pr-4 py-3 text-sm sm:text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50/50 focus:bg-white appearance-none">
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Siswa/Mahasiswa">Siswa / Mahasiswa</option>
                        <option value="Dosen/Guru">Dosen / Guru</option>
                        <option value="Tenaga Pendidik">Tenaga Pendidik</option>
                        <option value="Umum">Masyarakat Umum</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Keperluan -->
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Keperluan Kunjungan <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <i class="fa-solid fa-bookmark absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select id="keperluanInput" required
                        class="w-full pl-11 pr-4 py-3 text-sm sm:text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50/50 focus:bg-white appearance-none">
                        <option value="">-- Pilih Keperluan --</option>
                        <option value="Membaca Buku">Membaca Buku</option>
                        <option value="Meminjam/Mengembalikan">Meminjam / Mengembalikan Buku</option>
                        <option value="Tugas & Riset">Mengerjakan Tugas / Riset</option>
                        <option value="Diskusi Kelompok">Diskusi Kelompok</option>
                        <option value="Akses Komputer/Internet">Akses Komputer / Internet</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Catatan (Opsional) -->
            <div>
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Catatan <span class="text-slate-400 font-normal">(Opsional)</span>
                </label>
                <input type="text" id="catatanInput" placeholder="Judul buku / keperluan khusus..."
                    class="w-full px-4 py-3 text-sm sm:text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50/50 focus:bg-white">
            </div>

            <!-- Tombol Submit -->
            <button type="submit" id="btnSubmit"
                class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold text-base sm:text-lg rounded-xl shadow-lg shadow-indigo-200 transition duration-150 flex items-center justify-center space-x-2 mt-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Simpan Presensi</span>
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-slate-400 mt-auto">
        <p>&copy; Perpustakaan Digital. Silakan hubungi petugas jika memerlukan bantuan.</p>
    </footer>

    <!-- MODAL POP-UP LOGIN ADMIN -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 transform transition-all">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-indigo-600 text-lg"></i>
                    <h3 class="font-bold text-slate-800 text-base">Otentikasi Admin</h3>
                </div>
                <button onclick="tutupModalLogin()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form onsubmit="verifikasiAdmin(event)" class="mt-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">PIN / Password Admin</label>
                    <input type="password" id="pinInput" required placeholder="Masukkan PIN"
                        class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <p id="errorMessage" class="hidden text-xs text-rose-600 mt-1"><i class="fa-solid fa-circle-exclamation"></i> PIN salah! Silakan coba lagi.</p>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="tutupModalLogin()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold rounded-lg">
                        Batal
                    </button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow">
                        Masuk Admin
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbx4TXkIA-zhnGXu_TnbVh9HUeTKBKm5eiPxrsQ7nYqSOhYyXoNOD0m1x482x1l0BDFaJg/exec";
        const PIN_ADMIN = "Sulitditebak"; // Sesuaikan PIN Admin Anda di sini

        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);

            // Menutup dropdown jika mengklik di luar area menu
            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('dropdownMenu');
                const button = e.target.closest('button');
                if (!button || !button.getAttribute('onclick')?.includes('toggleMenu')) {
                    if (dropdown) dropdown.classList.add('hidden');
                }
            });
        });

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('liveClock');
            const dateEl = document.getElementById('liveDate');
            if (clockEl) clockEl.textContent = now.toLocaleTimeString('id-ID');
            if (dateEl) dateEl.textContent = now.toLocaleDateString('id-ID', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }

        function toggleMenu() {
            const dropdown = document.getElementById('dropdownMenu');
            if (dropdown) dropdown.classList.toggle('hidden');
        }

        function bukaModalLogin() {
            const dropdown = document.getElementById('dropdownMenu');
            const modal = document.getElementById('loginModal');
            if (dropdown) dropdown.classList.add('hidden');
            if (modal) modal.classList.remove('hidden');
            document.getElementById('pinInput').focus();
        }

        function tutupModalLogin() {
            const modal = document.getElementById('loginModal');
            if (modal) modal.classList.add('hidden');
            document.getElementById('pinInput').value = '';
            document.getElementById('errorMessage').classList.add('hidden');
        }

        // FUNGSI UTAMA VERIFIKASI ADMIN (DIPERBAIKI)
        function verifikasiAdmin(e) {
            e.preventDefault();
            const inputPin = document.getElementById('pinInput').value;

            if (inputPin === PIN_ADMIN) {
                // 1. Simpan tanda/token login di localStorage
                localStorage.setItem('admin_authenticated', 'true');
                
                // 2. Beri sedikit jeda agar localStorage tersimpan sempurna sebelum pindah
                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 100);
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('pinInput').value = '';
                document.getElementById('pinInput').focus();
            }
        }

        // Handle Presensi Form Submit
        async function handleFormSubmit(event) {
            event.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            const alertBox = document.getElementById('successAlert');
            const originalBtnText = btnSubmit.innerHTML;

            const record = {
                timestamp: new Date().toLocaleString('id-ID'),
                nama: document.getElementById('namaInput').value.trim(),
                nim_nik: document.getElementById('idInput').value.trim(),
                kategori: document.getElementById('kategoriInput').value,
                keperluan: document.getElementById('keperluanInput').value,
                catatan: document.getElementById('catatanInput').value.trim() || '-'
            };

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i><span>Proses Menyimpan...</span>`;

            let localData = JSON.parse(localStorage.getItem('absensi_perpus_data')) || [];
            localData.unshift(record);
            localStorage.setItem('absensi_perpus_data', JSON.stringify(localData));

            if (GAS_URL && !GAS_URL.includes("https://script.google.com/macros/s/AKfycbx4TXkIA-zhnGXu_TnbVh9HUeTKBKm5eiPxrsQ7nYqSOhYyXoNOD0m1x482x1l0BDFaJg/exec")) {
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(record)
                    });
                } catch (error) {
                    console.error("Gagal mengirim ke Google Sheets:", error);
                }
            }

            document.getElementById('presensiForm').reset();
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = originalBtnText;

            alertBox.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
